<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10493B">
<title>SalahSync — দৈনিক রুটিন</title>
<meta name="description" content="ফজরের ওয়াক্ত সেট করলেই সারাদিনের রুটিন স্বয়ংক্রিয়ভাবে তৈরি হয় — নামাজ, কোডিং, অফিস ও ইবাদতের সময়সূচি।">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="preload" href="./assets/fonts/Kalpurush.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body class="pb-16">

<div class="max-w-3xl mx-auto px-4 pt-6">

  <header class="card p-5 mb-4">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p id="app-eyebrow" class="eyebrow"></p>
        <h1 id="app-title" class="text-2xl font-bold" style="color:var(--forest-deep)"></h1>
        <p id="now-date" class="text-xs mt-1" style="color:var(--muted)"></p>
      </div>
      <div class="text-right flex flex-col items-end gap-2">
        <span id="now-clock" class="text-2xl font-bold" style="color:var(--forest)"></span>
        <div class="flex gap-2">
          <button id="lang-toggle" class="text-lg" title="Language">🌐</button>
          <button id="theme-toggle" class="text-lg">🌙</button>
          <button id="install-btn" class="text-lg hidden">⬇️</button>
          <button id="print-btn" class="text-lg">🖨️</button>
          <button id="settings-toggle" class="text-lg">⚙️</button>
        </div>
      </div>
    </div>
    <p id="countdown" class="text-sm mt-3 font-medium" style="color:var(--forest)"></p>
  </header>

  <section class="mb-4">
    <div id="prayer-panel"></div>
  </section>

  <div class="flex items-center justify-between mb-4">
    <div id="tabs" class="flex gap-2">
      <button data-profile="workday"></button>
      <button data-profile="friday"></button>
      <button data-profile="saturday"></button>
    </div>
    <span id="profile-sub" class="text-xs" style="color:var(--muted)"></span>
  </div>

  <div id="warnings-banner" class="hidden"></div>

  <div id="stats-cards" class="stats mb-4"></div>

  <main class="card p-5 mb-4">
    <ol id="timeline" class="rows"></ol>
  </main>

  <section class="card p-5 mb-4">
    <h2 id="habits-title" class="text-sm font-bold mb-3" style="color:var(--forest)"></h2>
    <div id="habits-panel"></div>
  </section>

  <section class="card p-5 mb-4">
    <h2 id="progress-title" class="text-sm font-bold mb-3" style="color:var(--forest)"></h2>
    <div id="streak-panel" class="flex gap-3 mb-4"></div>
    <div id="chart-panel"></div>
  </section>

  <footer class="text-center text-xs pb-6" style="color:var(--muted)">
    <span id="footer-location"></span> · <span id="footer-app-name"></span>
  </footer>
</div>

<div id="settings-drawer">
  <div id="settings-backdrop"></div>
  <aside id="settings-panel">
    <div class="flex items-center justify-between mb-3">
      <h2 id="settings-title-text" class="text-base font-bold" style="color:var(--forest)"></h2>
      <button id="settings-close" class="text-xl">✕</button>
    </div>
    <div id="settings-content"></div>
  </aside>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
